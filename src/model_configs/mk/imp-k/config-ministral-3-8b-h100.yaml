batch_size: 8
temperature: 0
top_p: 1
attention_head: 32
max_new_tokens: 16000
max_model_len: 65536  # headroom for long mk prompts (~43k tokens) + generation; native Ministral context is 256k
gpu_memory_utilization: 0.95
trust_remote_code: true
tokenizer_mode: mistral
# HF auto path avoids vLLM's Mistral-format Pixtral loader, which hard-requires
# xformers (broken on ROCm). vLLM 0.8.x still needs a text_config.architectures
# patch — applied in vllm_experiment.py via hf_overrides.
config_format: auto
load_format: auto
